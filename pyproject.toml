[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terimce"
version = "0.1.0"
description = "Oyun çevirileri için denetleyici ve ortak terim sözlüğü"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA"]
authors = [{ name = "misutesu-desu" }]
keywords = ["localization", "translation", "lint", "games", "turkish", "glossary"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: Turkish",
    "Topic :: Software Development :: Localization",
    "Environment :: Console",
]
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
terimce = "terimce.cli:main"

[project.urls]
Homepage = "https://github.com/misutesu-desu/terimce"
Issues = "https://github.com/misutesu-desu/terimce/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/terimce"]

[tool.hatch.build.targets.wheel.force-include]
"sozluk" = "terimce/sozluk"

[tool.pytest.ini_options]
testpaths = ["tests"]
